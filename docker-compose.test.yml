services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindcare_user
      POSTGRES_PASSWORD: mindcare_secure_pass
      POSTGRES_DB: mindcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcare_user -d mindcare"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkeydata_test:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_test:
  valkeydata_test:
