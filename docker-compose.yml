services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mindcare_user:mindcare_password@db:5432/mindcare
      VALKEY_URL: redis://valkey:6379
      JWT_SECRET: dev-secret-change-in-production
      NODE_ENV: development
      # Voice provider keys — uncomment and fill for real providers:
      # DEEPGRAM_API_KEY: ""
      # OPENAI_API_KEY: ""
      # ELEVENLABS_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindcare_user
      POSTGRES_PASSWORD: mindcare_password
      POSTGRES_DB: mindcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcare_user -d mindcare"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  valkeydata:
