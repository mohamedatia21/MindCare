name: Track 1 Infrastructure & Container Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-infrastructure:
    name: Docker Build, Healthchecks, Migrations & Live Tenant Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Host Dependencies
        run: npm ci

      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Build Application Container Image (Task 1.1)
        run: |
          docker build -t mindcare-app:ci .
          docker image inspect mindcare-app:ci --format='Image ID: {{.Id}}, User: {{.Config.User}}'

      - name: 6. Start Docker Compose Stack (Task 1.2)
        run: |
          docker compose up -d --build

      - name: 7. Await Multi-Container Healthy State with Timeout
        run: |
          echo "Waiting for db, valkey, and app to reach healthy status..."
          TIMEOUT=90
          START_TIME=$(date +%s)
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "ERROR: Timed out waiting for containers to become healthy after ${TIMEOUT}s"
              docker compose ps -a
              docker compose logs
              exit 1
            fi
            
            DB_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' $(docker compose ps -q db) 2>/dev/null || echo '"unknown"')
            VALKEY_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' $(docker compose ps -q valkey) 2>/dev/null || echo '"unknown"')
            APP_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' $(docker compose ps -q app) 2>/dev/null || echo '"unknown"')
            
            echo "Elapsed: ${ELAPSED}s | db: ${DB_HEALTH} | valkey: ${VALKEY_HEALTH} | app: ${APP_HEALTH}"
            
            if [ "$DB_HEALTH" = '"healthy"' ] && [ "$VALKEY_HEALTH" = '"healthy"' ] && [ "$APP_HEALTH" = '"healthy"' ]; then
              echo "SUCCESS: All containers reached healthy state!"
              break
            fi
            
            sleep 3
          done
          
          docker compose ps

      - name: 8. Verify Database Migrations in Live Postgres (Task 1.3)
        run: |
          echo "Checking applied migrations in database container..."
          docker compose exec -T db psql -U mindcare_user -d mindcare -c "SELECT version, name, applied_at FROM migrations ORDER BY version;"
          
          echo "Checking pgvector and vectorscale extensions..."
          docker compose exec -T db psql -U mindcare_user -d mindcare -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('vector', 'vectorscale');"

      - name: 9. Run Live Tenant Isolation Test Suite (Task 1.4)
        run: |
          echo "Executing live database tenant-isolation tests against postgres:16..."
          export DATABASE_URL="postgresql://mindcare_user:mindcare_password@localhost:5432/mindcare"
          export VALKEY_URL="redis://localhost:6379"
          
          npx vitest run tests/tenant-isolation.test.ts --reporter=verbose
          
          # Ensure test was NOT skipped and passed completely
          TEST_OUTPUT=$(DATABASE_URL="postgresql://mindcare_user:mindcare_password@localhost:5432/mindcare" npx vitest run tests/tenant-isolation.test.ts)
          echo "$TEST_OUTPUT"
          
          if echo "$TEST_OUTPUT" | grep -q "0 skipped" || echo "$TEST_OUTPUT" | grep -q "6 passed (6)"; then
            echo "SUCCESS: Tenant isolation verified against live Postgres 16."
          else
            echo "ERROR: Tenant isolation tests were skipped or failed!"
            exit 1
          fi

      - name: 10. Teardown Stack
        if: always()
        run: |
          docker compose logs app
          docker compose down -v
