services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Secure DB Connection
      DATABASE_URL: postgresql://mindcare_user:${DB_PASSWORD:-mindcare_secure_pass}@db:5432/mindcare
      # Valkey Connection
      VALKEY_URL: redis://valkey:6379
      # Production Enforcement
      NODE_ENV: production
      # Authentication Identity Provider Boundaries (No local secrets)
      IDP_JWKS_URI: ${IDP_JWKS_URI:-https://example.auth0.com/.well-known/jwks.json}
      IDP_ISSUER: ${IDP_ISSUER:-https://example.auth0.com/}
      IDP_AUDIENCE: ${IDP_AUDIENCE:-mindcare-production}
      # Voice provider keys — Must be passed via environment
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrate:
    build: .
    command: ["node", "dist/scripts/run-migrations.js"]
    environment:
      DATABASE_URL: postgresql://mindcare_user:${DB_PASSWORD:-mindcare_secure_pass}@db:5432/mindcare
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindcare_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindcare_secure_pass}
      POSTGRES_DB: mindcare
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcare_user -d mindcare"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  valkey:
    image: valkey/valkey:8
    volumes:
      - valkeydata_prod:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata_prod:
  valkeydata_prod:
